[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pylai"
version = "0.0.1"
description = "AI software engineering library"
readme = "README.md"
requires-python = ">=3.6"
authors = [
    { name="Maxime BLIDI", email="blidi.maxime@gmail.com" }
]
dependencies = [
    "python-dotenv==1.0.1",
    "tqdm",
    "pydantic",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
all = ["pyldl[agents,crewai]"]
agents = [
]
crewai = [
    "crewai",
    "fastapi",
]
langgraph = [
]
api = [
    "pylcloud[database,gpt] @ https://github.com/PyYel/PyYel-CloudOps/archive/refs/heads/main.tar.gz",
]


[tool.setuptools.packages.find]
where = ["."]
