[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pylai"
version = "0.0.1"
description = "AI software engineering library"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name="Maxime BLIDI", email="blidi.maxime@gmail.com" }
]
dependencies = [
    "python-dotenv>=1.0.0",
    "tqdm",
    "pydantic",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
all = ["pylai[agentic,langgraph]"]
agentic = [
    "pydantic-ai-slim[openai,mcp]",
    "pylcloud[database] @ https://github.com/PyYel/pylcloud/archive/refs/heads/main.tar.gz",
]
langgraph = [
]


[tool.setuptools.packages.find]
where = ["."]
